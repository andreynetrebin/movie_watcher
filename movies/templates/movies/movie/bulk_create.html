<!-- templates/movies/movie/bulk_create.html -->
{% extends "base.html" %}

{% block content %}
<h2>Массовая загрузка фильмов</h2>

<!-- Информация о лимите на добавление фильмов -->
<p>Вы можете добавить не более 5 фильмов за один раз. Пожалуйста, введите URL-адреса фильмов, каждый на новой строке.</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Загрузить фильмы</button>
</form>
{% endblock %}
