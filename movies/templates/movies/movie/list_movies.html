{% load thumbnail %}
{% for movie in movies %}
<div class="image">
<a href="{{ movie.get_absolute_url }}">
<!--{% thumbnail movie.poster 300x300 crop="smart" as im %}-->
    {% thumbnail movie.poster 250x200 as im %}
    <a href="{{ movie.get_absolute_url }}">
<img src="{{ im.url }}">
</a>
</a>
<div class="info">
<a href="{{ movie.get_absolute_url }}" class="title">
{{ movie.title }}
</a>
</div>
</div>
{% endfor %}
