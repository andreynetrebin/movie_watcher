{% extends "base.html" %}
{% block title %}Пароль изменён — Movie Watcher{% endblock %}
{% block content %}
<section class="cinema-auth-page">
  <div class="cinema-auth-card cinema-auth-card--success">
    <div class="cinema-auth-success-icon" aria-hidden="true">✓</div>
    <p class="cinema-auth-eyebrow">Безопасность аккаунта</p>
    <h1>Пароль изменён</h1>
    <p class="cinema-auth-lead">Новый пароль успешно сохранён. Теперь вы можете продолжить пользоваться аккаунтом.</p>
    <a class="cinema-auth-submit cinema-auth-submit--link" href="{% url 'dashboard' %}">Вернуться в кабинет <span aria-hidden="true">→</span></a>
  </div>
</section>
{% endblock %}
