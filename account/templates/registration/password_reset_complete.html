{% extends "base.html" %}
{% block title %}Пароль установлен — Movie Watcher{% endblock %}
{% block content %}
<section class="cinema-auth-page">
  <div class="cinema-auth-card cinema-auth-card--success">
    <div class="cinema-auth-success-icon" aria-hidden="true">✓</div>
    <p class="cinema-auth-eyebrow">Готово</p>
    <h1>Пароль успешно установлен</h1>
    <p class="cinema-auth-lead">Теперь вы можете войти в аккаунт с новым паролем.</p>
    <a class="cinema-auth-submit cinema-auth-submit--link" href="{% url 'login' %}">Войти в аккаунт <span aria-hidden="true">→</span></a>
  </div>
</section>
{% endblock %}
